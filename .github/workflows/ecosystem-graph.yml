name: Ecosystem graph checks

on:
  pull_request:
    paths:
      - '.ai/ecosystem.json'
      - 'scripts/ecosystem.mjs'
      - 'scripts/ecosystem.test.mjs'
      - 'package.json'
      - '.github/workflows/ecosystem-graph.yml'
  push:
    branches: [main]
    paths:
      - '.ai/ecosystem.json'
      - 'scripts/ecosystem.mjs'
      - 'scripts/ecosystem.test.mjs'
      - 'package.json'
      - '.github/workflows/ecosystem-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test ecosystem graph
        run: npm run test:ecosystem
      - name: Validate current manifest
        run: npm run ecosystem -- validate
